x-dev-build: &dev-build
  build:
    context: .
    dockerfile_inline: |
      FROM oven/bun:1-debian
      RUN apt-get update && \
          apt-get install -y --no-install-recommends \
            git python3 make g++ ca-certificates curl && \
          install -m 0755 -d /etc/apt/keyrings && \
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc && \
          chmod a+r /etc/apt/keyrings/docker.asc && \
          echo "deb [arch=$$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $$(. /etc/os-release && echo $$VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list && \
          apt-get update && \
          apt-get install -y --no-install-recommends docker-ce-cli && \
          rm -rf /var/lib/apt/lists/*
      WORKDIR /app

services:
  postgres:
    image: postgres:17-alpine
    container_name: blankcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blankcode}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-blankcode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # The whole app: Nuxt, with the Effect API mounted at /api inside Nitro.
  # This is the same shape that deploys to Vercel, so dev and production do not
  # disagree about how a request reaches a handler.
  #
  # SECURITY NOTE: submissions execute inline in the request that creates them,
  # so this container needs Docker socket access to sandbox them. That is
  # host-level Docker access, and it is for local development only — in
  # production EXECUTION_BACKEND=vercel-sandbox runs them in microVMs instead.
  web:
    <<: *dev-build
    container_name: blankcode-web
    restart: unless-stopped
    user: root
    command: >
      sh -c "bun install &&
             bunx turbo build --filter=@blankcode/shared --filter=@blankcode/db --filter=@blankcode/api &&
             cd packages/db && bunx drizzle-kit push --force && cd /app &&
             cd apps/web && bunx nuxi dev --host 0.0.0.0"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-blankcode}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (copy from .env.example and change it)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-docker}
      DOCKER_ENABLED: ${DOCKER_ENABLED:-true}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-60000}
      EXECUTION_MEMORY_MB: ${EXECUTION_MEMORY_MB:-256}
      EXECUTION_WORKSPACE_PATH: /tmp/blankcode-workspaces
    ports:
      - "3001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/blankcode-workspaces:/tmp/blankcode-workspaces
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - parser_node_modules:/app/packages/exercise-parser/node_modules
      - importer_node_modules:/app/tools/content-importer/node_modules
      - generator_node_modules:/app/tools/exercise-generator/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      runner-images:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # One-shot: builds all per-language runner images on the host Docker daemon
  # via the mounted socket, then exits 0. The API's depends_on gates boot
  # on this completing, so `docker compose up` "just works" — no profiles, no
  # surprise --pull=never failures the first time someone clones the repo.
  runner-images:
    image: docker:27-cli
    container_name: blankcode-runner-images
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/runners:/runners:ro
    entrypoint: ["/bin/sh", "/runners/build-all.sh"]

volumes:
  postgres_data:
  node_modules:
  api_node_modules:
  web_node_modules:
  db_node_modules:
  shared_node_modules:
  parser_node_modules:
  importer_node_modules:
  generator_node_modules:
