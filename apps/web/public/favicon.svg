<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="BlankCode">
  <!--
    The product in one mark: a sheet of ruled paper with the blank you fill in.

    Only two rules are drawn, not a full grid — at 16px a real grid collapses
    into grey mush, while a single cross still reads as "graph paper". The
    orange bar is `--signal` (hsl(22 90% 48%)), the one loud colour in the
    system, and it sits on the baseline where a blank belongs.
  -->
  <rect width="100" height="100" rx="12" fill="#0d1017" />

  <g stroke="#2b3242" stroke-width="4">
    <path d="M0 34h100" />
    <path d="M34 0v100" />
  </g>

  <!-- The mark. Deliberately the heaviest shape on the tile. -->
  <rect x="20" y="62" width="60" height="14" rx="3" fill="#e95d0c" />

  <!-- The caret above it: the cursor waiting in the blank. -->
  <rect x="46" y="42" width="8" height="12" rx="2" fill="#e95d0c" opacity="0.55" />
</svg>
