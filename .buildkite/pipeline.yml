# Origin + Buildkite. Default branch in the pipeline UI must be `preview`.
# Enable Origin "Build tags". Pushing v* tags promotes the preview deploy.
# UI steps should be: command: buildkite-agent pipeline upload
agents:
  queue: linux-medium

steps:
  - label: ":bun: CI"
    key: ci
    if: build.tag == null
    timeout_in_minutes: 25
    cancel_on_build_failing: true
    env:
      CI: "true"
      BUN_VERSION: "1.3.7"
      JWT_SECRET: ci-only-secret-not-used-for-anything-real
      NUXT_TELEMETRY_DISABLED: "1"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 143
          limit: 2
    command: |
      set -euo pipefail
      . .buildkite/install-bun.sh
      bun install --frozen-lockfile
      bun run verify

  - label: ":postgres: Migrate preview"
    key: migrate-preview
    depends_on: ci
    if: build.branch == "preview" && build.tag == null
    timeout_in_minutes: 10
    agents:
      queue: linux-small
    secrets:
      - BLANKCODE_DATABASE_URL_UNPOOLED_PREVIEW
    env:
      BUN_VERSION: "1.3.7"
    command: |
      set -euo pipefail
      . .buildkite/install-bun.sh
      bun install --frozen-lockfile --ignore-scripts
      export DATABASE_URL="$${BLANKCODE_DATABASE_URL_UNPOOLED_PREVIEW:?}"
      bun run db:migrate

  - label: ":postgres: Migrate production"
    key: migrate-production
    depends_on: ci
    if: build.branch == "main" && build.tag == null
    timeout_in_minutes: 10
    agents:
      queue: linux-small
    secrets:
      - BLANKCODE_DATABASE_URL_UNPOOLED_PRODUCTION
    env:
      BUN_VERSION: "1.3.7"
    command: |
      set -euo pipefail
      . .buildkite/install-bun.sh
      bun install --frozen-lockfile --ignore-scripts
      export DATABASE_URL="$${BLANKCODE_DATABASE_URL_UNPOOLED_PRODUCTION:?}"
      bun run db:migrate

  - label: ":rocket: Promote preview to production"
    key: promote
    if: build.tag =~ /^v/
    timeout_in_minutes: 20
    agents:
      queue: linux-small
    secrets:
      - VERCEL_TOKEN
    concurrency: 1
    concurrency_group: "blankcode/promote"
    concurrency_method: eager
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 143
          limit: 2
      manual:
        allowed: true
        reason: "Retry after the preview deploy is READY."
    command: bash .buildkite/promote.sh
    env:
      VERCEL_PROJECT_ID: prj_hCOEP52IAeqCMcsUkxTIjwxwDbrr
