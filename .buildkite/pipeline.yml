# Origin + Buildkite. Default branch in the pipeline UI must be `preview`.
# Enable Origin "Build tags". Pushing v* tags promotes the preview deploy.
# UI steps should be: command: buildkite-agent pipeline upload
steps:
  - label: ":github: CI"
    key: ci
    if: build.tag == null
    plugins:
      - github-actions#latest:
          workflow: .github/workflows/ci.yml

  - label: ":postgres: Migrations"
    key: migrate
    depends_on: ci
    if: build.tag == null
    plugins:
      - github-actions#latest:
          workflow: .github/workflows/migrations.yml

  - label: ":rocket: Promote preview to production"
    key: promote
    if: build.tag =~ /^v/
    command: bash .buildkite/promote.sh
    env:
      VERCEL_PROJECT_ID: prj_hCOEP52IAeqCMcsUkxTIjwxwDbrr
