name: Migrations

# Runs drizzle migrations against the matching Neon branch when the schema or
# the migration files change.
#
# Both run on push. Preview goes straight through; production waits for a
# reviewer, which its GitHub Environment enforces — this repository is public,
# so required reviewers are available and the gate is real rather than
# decorative. (An earlier version of this comment said the repository was
# private and used that to justify leaving production out. It was wrong.)
#
# Each Environment is also pinned to one branch, so a job asking for the
# production identity from anywhere but `main` cannot start.
#
# Secrets reach CI through tvault identity mode. There is one sealed artifact
# per target, each encrypted to its own recipient, so the preview CI identity
# cannot open the production one — a single file with two sections would give
# every runner both. The artifacts hold nothing but a database URL, and the
# identity key that opens one lives in its GitHub Environment, whose
# deployment-branch policy independently enforces the branch rule below.
#
# One thing that had to be true before any of this could work: the databases
# were migrated by hand and drizzle had no record of it, so `drizzle-kit
# migrate` would have tried to apply every migration from scratch against
# objects that already existed. Both branches were baselined first —
# `drizzle.__drizzle_migrations` now lists all nine — and verified by running
# the command and watching it do nothing.

on:
  push:
    branches: [preview, main]
    paths:
      - "packages/db/drizzle/**"
      - "packages/db/src/schema/**"
      - "packages/db/drizzle.config.ts"
  workflow_dispatch:
    inputs:
      target:
        description: "Which database to migrate"
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

# Never two migrations at once against the same database, and never cancel one
# half-way: an interrupted migration leaves state nobody can reason about.
concurrency:
  group: migrations-${{ inputs.target || (github.ref_name == 'main' && 'production' || 'preview') }}
  cancel-in-progress: false

jobs:
  migrate:
    # Lowercase `production` on purpose: that is the Environment's actual name,
    # and GitHub silently creates a new unprotected one if this does not match.
    environment: ${{ (inputs.target || (github.ref_name == 'main' && 'production' || 'preview')) == 'production' && 'production' || 'Preview' }}
    runs-on: ubuntu-latest
    steps:
      # Before checkout, before secrets, before the database is touched. The
      # Environment policy enforces the same thing independently; this exists so
      # a misconfigured Environment is not the only thing standing in the way.
      - name: Validate migration target
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          TARGET: ${{ inputs.target || (github.ref_name == 'main' && 'production' || 'preview') }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::Migrations run from branches, not $REF_TYPE." >&2
            exit 1
          fi

          case "$EVENT_NAME:$TARGET" in
            push:preview)
              [ "$FULL_REF" = "refs/heads/preview" ] || {
                echo "::error::Preview migrations come from the preview branch." >&2; exit 1; }
              ;;
            push:production)
              [ "$FULL_REF" = "refs/heads/main" ] || {
                echo "::error::Production migrations come from main." >&2; exit 1; }
              ;;
            workflow_dispatch:preview)
              [ "$FULL_REF" = "refs/heads/preview" ] || {
                echo "::error::Preview migrations must be dispatched from the preview branch." >&2; exit 1; }
              ;;
            workflow_dispatch:production)
              [ "$FULL_REF" = "refs/heads/main" ] || {
                echo "::error::Production migrations must be dispatched from main." >&2; exit 1; }
              ;;
            *)
              echo "::error::Unsupported combination: $EVENT_NAME → $TARGET" >&2
              exit 1
              ;;
          esac

          echo "Validated: $EVENT_NAME → $TARGET from $FULL_REF"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Pinned and checksummed. Resolving `releases/latest` inside a job that
      # holds a database credential means whoever can publish a release can read
      # the database.
      - name: Install verified TinyVault CLI
        env:
          TVAULT_VERSION: "0.21.0"
          TVAULT_LINUX_AMD64_SHA256: "eaa4763b6af7624c0aba979db067dc8576d4bf81b8a7f7d5379a6684180d8935"
        run: |
          set -euo pipefail
          archive="tvault_${TVAULT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL \
            "https://github.com/abdul-hamid-achik/tinyvault/releases/download/v${TVAULT_VERSION}/${archive}" \
            -o "${archive_path}"
          printf '%s  %s\n' "${TVAULT_LINUX_AMD64_SHA256}" "${archive_path}" | sha256sum --check -
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" tvault
          chmod 0755 "${RUNNER_TEMP}/tvault"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/tvault" --version

      - name: Decrypt secrets and run migrations
        env:
          TVAULT_IDENTITY_KEY: ${{ secrets.TVAULT_MIGRATION_IDENTITY_KEY }}
          TARGET: ${{ inputs.target || (github.ref_name == 'main' && 'production' || 'preview') }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${TVAULT_IDENTITY_KEY:-}" ]; then
            echo "::error::TVAULT_MIGRATION_IDENTITY_KEY is not set in this Environment." >&2
            exit 1
          fi

          SEALED_FILE="ci/migration-${TARGET}.sealed"
          [ -f "$SEALED_FILE" ] || { echo "::error::$SEALED_FILE not found." >&2; exit 1; }

          SECRET_FILE=$(mktemp "${RUNNER_TEMP}/blankcode-migration.XXXXXX")
          trap 'rm -f "$SECRET_FILE"' EXIT
          tvault decrypt-env --in "$SEALED_FILE" --out "$SECRET_FILE"

          # Parsed rather than sourced: connection strings contain `&`, which a
          # shell would treat as a job-control operator.
          #
          # Unpooled on purpose — drizzle takes advisory locks during a
          # migration, and Neon's pgbouncer pooler does not hold them across
          # statements.
          DB_URL=$(awk '/^DATABASE_URL_UNPOOLED=/{sub(/^[^=]*=/, ""); print; exit}' "$SECRET_FILE")
          if [ -z "$DB_URL" ]; then
            echo "::error::No DATABASE_URL_UNPOOLED in the $TARGET section." >&2
            exit 1
          fi
          echo "::add-mask::$DB_URL"
          export DATABASE_URL="$DB_URL"
          unset TVAULT_IDENTITY_KEY DB_URL

          echo "Migrating $TARGET…"
          cd packages/db
          bun run db:migrate
