name: Point preview domain

# Re-points preview.blankcode.dev at the deployment of every push to the
# preview branch — the same way main automatically becomes production.
#
# This exists because Vercel's domain→git-branch tracking is dashboard-only
# (checked: no CLI flag, no vercel.json field, and the toggle is absent from
# the project settings API surface we can reach). `vercel alias set` does the
# same job per deployment; this workflow just runs it at the moment there is a
# new deployment to point at.
#
# Needs one secret in the GitHub "Preview" environment: VERCEL_TOKEN, a token
# from vercel.com/account/tokens scoped to the the-lacanians team. Store it in
# tvault (blankcode-preview) and mirror it with:
#   tvault get VERCEL_TOKEN -p blankcode-preview | gh secret set VERCEL_TOKEN \
#     --env Preview --repo abdul-hamid-achik/blankcode
# Until it exists, this workflow fails with a clear message and changes
# nothing.

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-domain
  # Newest push wins; aliasing an older deployment after a newer one is a
  # rollback nobody asked for.
  cancel-in-progress: true

jobs:
  alias:
    environment: Preview
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit's deployment, then alias it
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM: the-lacanians
          DOMAIN: preview.blankcode.dev
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set in the Preview environment. Create one at vercel.com/account/tokens, store it in tvault, and mirror it with gh secret set." >&2
            exit 1
          fi

          npm install -g vercel@latest >/dev/null 2>&1

          # The deployment starts from Vercel's own git webhook, so it may not
          # exist yet. Poll for the READY preview deployment of THIS commit —
          # matching the SHA, not "newest", so a racing push cannot make us
          # alias someone else's build.
          for attempt in $(seq 1 60); do
            url=$(vercel ls --scope "$TEAM" --token "$VERCEL_TOKEN" \
                    --environment preview --status READY --limit 20 --json 2>/dev/null \
              | node -e '
                  let raw = "";
                  process.stdin.on("data", (c) => (raw += c));
                  process.stdin.on("end", () => {
                    const data = JSON.parse(raw);
                    const items = Array.isArray(data) ? data : (data.deployments ?? data.items ?? []);
                    const hit = items.find((d) => (d.meta ?? {}).githubCommitSha === process.env.SHA);
                    if (hit) process.stdout.write(hit.url);
                  });
                ')
            if [ -n "${url:-}" ]; then
              echo "deployment ready after ${attempt} checks: $url"
              vercel alias set "$url" "$DOMAIN" --scope "$TEAM" --token "$VERCEL_TOKEN"
              echo "aliased $DOMAIN → $url"
              exit 0
            fi
            sleep 10
          done

          echo "::error::No READY preview deployment for $SHA after 10 minutes." >&2
          exit 1
