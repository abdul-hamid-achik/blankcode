name: CI

# Vercel builds and deploys from its own git integration, so CI's job is to
# fail loudly before that happens — not to ship anything itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # lint + typecheck + tests + dead-code check + content validation
      - run: bun run verify
        env:
          JWT_SECRET: ci-only-secret-not-used-for-anything-real
